<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinkShop</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff4f8;
padding-bottom:80px;
}

header{
position:sticky;
top:0;
background:#ff4fa3;
padding:12px;
display:flex;
align-items:center;
gap:10px;
z-index:1000;
}

.logo{
font-size:25px;
color:white;
font-weight:bold;
}

.search{
flex:1;
background:white;
border-radius:20px;
padding:10px;
display:flex;
align-items:center;
}

.search input{
width:100%;
border:none;
outline:none;
font-size:15px;
margin-left:8px;
}

.icon{
color:white;
font-size:22px;
position:relative;
cursor:pointer;
}

#badge{
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
width:18px;
height:18px;
font-size:12px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
}

.banner{
margin:15px;
border-radius:15px;
overflow:hidden;
}

.banner img{
width:100%;
height:180px;
object-fit:cover;
}

.kategori{
display:flex;
justify-content:space-around;
padding:15px;
}

.itemKategori{
text-align:center;
cursor:pointer;
}

.itemKategori i{
background:white;
width:60px;
height:60px;
line-height:60px;
font-size:28px;
border-radius:50%;
color:#ff4fa3;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.itemKategori p{
margin-top:8px;
font-size:13px;
}

.judul{
padding:15px;
font-size:22px;
color:#ff2f92;
font-weight:bold;
}

.produk{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 12px rgba(0,0,0,.15);
transition:.2s;
}

.card:hover{
transform:scale(1.02);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.info{
padding:10px;
}

.nama{
font-weight:bold;
font-size:16px;
margin-bottom:8px;
}

.harga{
color:#ff2f92;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.btn{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#ff4fa3;
color:white;
font-size:15px;
cursor:pointer;
}

.btn:hover{
background:#ff2f92;
}

#keranjang{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:15px;
box-shadow:0 -3px 15px rgba(0,0,0,.2);
display:none;
max-height:300px;
overflow:auto;
}

#listBarang{
margin:10px 0;
}

.total{
font-size:20px;
font-weight:bold;
color:#ff2f92;
margin-top:10px;
}

.checkout{
width:100%;
padding:12px;
border:none;
background:#ff2f92;
color:white;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<div class="logo">
🛍
</div>

<div class="search">
<i class="fa fa-search"></i>
<input

</div>

</header>

<div class="banner">

</div>

<div class="kategori">

</div>

</div>

<div class="card">

<button class="btn" onclick="tambah('Jam Tangan',320000)">+ Keranjang</button>

<div class="card">

</div>
</div>

</div>

<div id="keranjang">

<div id="listBarang">
Belum ada barang.
</div>

Total: <span id="totalHarga">Rp0</span>
</div>

<button class="checkout" onclick="checkout()">
Checkout
</button>

</div>
