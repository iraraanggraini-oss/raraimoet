<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinkShop - Halaman Penjual</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fff5f8;
}

header{
background:#ff4f8b;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:bold;
}

.search{
width:40%;
padding:10px;
border:none;
border-radius:20px;
}

.profile{
font-size:25px;
}

.banner{
margin:20px;
background:linear-gradient(90deg,#ff79a8,#ffb6c1);
padding:35px;
border-radius:15px;
color:white;
text-align:center;
}

.menu{
display:flex;
justify-content:center;
gap:20px;
margin:20px;
flex-wrap:wrap;
}

.card-menu{
background:white;
width:120px;
padding:20px;
text-align:center;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card-menu i{
font-size:30px;
color:#ff4f8b;
margin-bottom:10px;
}

.judul{
margin:20px;
color:#ff4f8b;
}

.produk{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.isi{
padding:15px;
}

.harga{
color:#ff4f8b;
font-weight:bold;
margin:8px 0;
}

button{
width:100%;
padding:10px;
background:#ff4f8b;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

footer{
margin-top:30px;
padding:20px;
text-align:center;
background:#ff4f8b;
color:white;
}
</style>

</head>
<body>

<header>
<div class="logo">PinkShop Seller</div>

<input class="search" type="text" placeholder="Cari produk...">

<div class="profile">
<i class="fa-solid fa-user-circle"></i>
</div>
</header>

<div class="banner">
<h1>Dashboard Penjual</h1>
<p>Kelola Produk dan Penjualan Anda</p>
</div>

<div class="menu">

<div class="card-menu">
<i class="fa-solid fa-box"></i>
<p>Produk</p>
</div>

<div class="card-menu">
<i class="fa-solid fa-cart-shopping"></i>
<p>Pesanan</p>
</div>

<div class="card-menu">
<i class="fa-solid fa-wallet"></i>
<p>Keuangan</p>
</div>

<div class="card-menu">
<i class="fa-solid fa-chart-line"></i>
<p>Laporan</p>
</div>

</div>

<h2 class="judul">Produk Terlaris</h2>

<div class="produk">

<div class="card">
<img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="Kaos Oversize">
<div class="isi">
<h3>Kaos Oversize</h3>
<p class="harga">Rp89.000</p>
<button>Lihat Detail</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sepatu Sneakers">
<div class="isi">
<h3>Sepatu Sneakers</h3>
<p class="harga">Rp299.000</p>
<button>Lihat Detail</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500" alt="Hoodie">
<div class="isi">
<h3>Hoodie Premium</h3>
<p class="harga">Rp159.000</p>
<button>Lihat Detail</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500" alt="Celana Jeans">
<div class="isi">
<h3>Celana Jeans</h3>
<p class="harga">Rp179.000</p>
<button>Lihat Detail</button>
</div>
</div>

</div>

<footer>
© 2026 PinkShop Seller Dashboard
</footer>

</body>
</html>
